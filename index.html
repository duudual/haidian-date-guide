<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>海淀约会指南｜双人活动＋晚餐</title>
<meta name="description" content="北京海淀、五道口一带的双人活动和晚餐参考，附照片、对比和原帖。">
<meta name="robots" content="noindex, nofollow">
<meta property="og:title" content="海淀约会指南｜双人活动＋晚餐">
<meta property="og:description" content="下午一起做手作，晚上去五道口或学院路吃饭。查看地点、照片和原帖。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://duudual.github.io/haidian-date-guide/">
<meta property="og:image" content="https://duudual.github.io/haidian-date-guide/media/e9462783a9151693.webp">
<style>
/* Layout: one reading column (max 1040px). Summary and collection funnel up top, then a quiet
   segmented switch between views. Photos lead the cards; color is reserved for the accent and state. */
:root {
  --bg: #f6f7f9;
  --surface: #ffffff;
  --ink: #16181d;
  --muted: #6a707c;
  --faint: #e6e8ec;
  --accent: #3d5afe;
  --accent-soft: #eaeeff;
  --keep: #12936b;
  --maybe: #b7791f;
  --drop: #a0a6b1;
  --warn: #b45309;
  --warn-soft: #fdf3e4;
  --xhs: #e0394d;
  --bili: #1f9ad6;
  --s1: #3d5afe; --s2: #d9480f; --s3: #0b8a6f; --s4: #9c36b5; --s5: #c2255c; --s6: #5c6b7a;
  --font: "Inter", -apple-system, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
  --radius: 14px;
  --tiles: none;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111317; --surface: #1a1d23; --ink: #eceef2; --muted: #9aa1ad; --faint: #2a2e36;
    --accent: #8c9eff; --accent-soft: #232a4a; --keep: #3ecf9c; --maybe: #e8b04b; --drop: #646b78;
    --warn: #f0a94b; --warn-soft: #2e2416; --xhs: #ff6b7d; --bili: #5cc1f0; --s1: #8c9eff; --s2: #ff8a50; --s3: #4fd1a5; --s4: #d58cf0; --s5: #f783ac; --s6: #9aa7b4; --tiles: brightness(.72) saturate(.75); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111317; --surface: #1a1d23; --ink: #eceef2; --muted: #9aa1ad; --faint: #2a2e36;
  --accent: #8c9eff; --accent-soft: #232a4a; --keep: #3ecf9c; --maybe: #e8b04b; --drop: #646b78;
  --warn: #f0a94b; --warn-soft: #2e2416; --xhs: #ff6b7d; --bili: #5cc1f0; --s1: #8c9eff; --s2: #ff8a50; --s3: #4fd1a5; --s4: #d58cf0; --s5: #f783ac; --s6: #9aa7b4; --tiles: brightness(.72) saturate(.75); color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.65 var(--font); }
a { color: inherit; }
img { max-width: 100%; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.wrap { max-width: 1040px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Header */
header { padding-block: 40px 8px; display: grid; gap: 14px; }
.eyebrow { font-size: 12px; letter-spacing: .08em; color: var(--muted); }
h1 { font-size: clamp(24px, 4vw, 32px); line-height: 1.25; margin: 0; font-weight: 700; letter-spacing: -.01em; text-wrap: balance; }
.summary { margin: 0; max-width: 68ch; font-size: 16px; white-space: pre-wrap; }
.coverage { font-size: 13px; color: var(--muted); }

/* Funnel */
.funnel { display: grid; gap: 8px; margin-top: 6px; max-width: 560px; }
.funnel-row { display: grid; grid-template-columns: 44px 1fr 56px; align-items: center; gap: 10px; font-size: 13px; }
.funnel-row .lab { color: var(--muted); }
.funnel-row .num { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.bar { height: 8px; border-radius: 99px; background: var(--faint); overflow: hidden; display: flex; }
.bar i { display: block; height: 100%; }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.legend span::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; background: var(--c); vertical-align: 1px; }

/* Switch */
nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 1000; background: var(--bg); padding-block: 14px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 1001; background: var(--bg); }
.seg { display: inline-flex; gap: 2px; padding: 3px; background: var(--faint); border-radius: 10px; max-width: 100%; overflow-x: auto; }
.seg button { border: 0; background: transparent; color: var(--muted); font: 500 14px var(--font); padding: 6px 14px; border-radius: 8px; cursor: pointer; white-space: nowrap; }
.seg button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
main { padding-block: 6px 72px; }

/* Cards */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 18px; align-items: start; }
.card { background: var(--surface); border-radius: var(--radius); overflow: hidden; display: flex; flex-direction: column; min-width: 0; scroll-margin-top: 80px; }
.cover { aspect-ratio: 4 / 3; width: 100%; object-fit: cover; display: block; background: var(--faint); cursor: zoom-in; }
.card-body { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 10px; }
.card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.card h3 { margin: 0; font-size: 17px; line-height: 1.35; }
.pin { flex: none; width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: #fff; font: 600 12px/22px var(--font); text-align: center; }
.facts { font-size: 13px; color: var(--muted); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: 12px; padding: 1px 8px; border-radius: 6px; background: var(--bg); color: var(--muted); }
.flag { font-size: 12px; padding: 1px 8px; border-radius: 6px; background: var(--warn-soft); color: var(--warn); }
.pc { display: grid; gap: 6px; font-size: 14px; margin: 0; padding: 0; list-style: none; }
.pc li { display: grid; grid-template-columns: 14px 1fr; gap: 6px; }
.pc li::before { content: "+"; color: var(--keep); font-weight: 700; }
.pc li.con::before { content: "−"; color: var(--warn); }
.strip { display: flex; gap: 6px; overflow-x: auto; }
.strip img { height: 56px; width: 56px; object-fit: cover; border-radius: 8px; cursor: zoom-in; flex: none; }
.src { border-top: 1px solid var(--faint); padding-top: 10px; display: grid; gap: 6px; font-size: 13px; }
.src a { text-decoration: none; display: grid; grid-template-columns: auto 1fr; gap: 8px; align-items: baseline; }
.src a:hover .t { color: var(--accent); }
.src .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.src q { display: block; color: var(--muted); grid-column: 2; font-size: 12.5px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--c); display: inline-block; transform: translateY(-1px); }
.src details { display: grid; gap: 6px; }
.src summary { cursor: pointer; color: var(--muted); font-size: 12.5px; list-style: none; }
.src summary::-webkit-details-marker { display: none; }
.src summary:hover { color: var(--accent); }
.src details[open] summary { margin-bottom: 6px; }
.consensus { display: inline-flex; gap: 3px; align-items: center; font-size: 12px; color: var(--muted); }

/* Sections */
.sec { margin-bottom: 40px; scroll-margin-top: 72px; }
.sec-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin: 4px 0 14px; }
.sec-head h2 { margin: 0; font-size: 20px; letter-spacing: -.005em; display: flex; align-items: center; gap: 9px; }
.sec-head h2::before { content: ""; width: 10px; height: 10px; border-radius: 3px; background: var(--c); }
.sec-head .n { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.sec-note { flex-basis: 100%; font-size: 14px; color: var(--muted); max-width: 68ch; margin: 0; }
.jump { display: flex; gap: 6px; flex-wrap: wrap; margin: 2px 0 22px; }
.jump a { text-decoration: none; font-size: 13px; padding: 4px 12px; border-radius: 99px; background: var(--surface); color: var(--ink); display: inline-flex; gap: 6px; align-items: center; }
.jump a i { width: 7px; height: 7px; border-radius: 2px; background: var(--c); }
.jump a span { color: var(--muted); font-variant-numeric: tabular-nums; }
.card.is-pick { box-shadow: inset 0 0 0 2px var(--c, var(--accent)); }
.pick { flex: none; font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 6px; color: #fff; background: var(--c, var(--accent)); }
.when { font-size: 13px; color: var(--ink); }
.cmp + .cmp { margin-top: 26px; }
.cmp h3 { font-size: 15px; margin: 0 0 10px; }

/* Map + route */
.map-layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 18px; }
#map-canvas { height: 68vh; min-height: 380px; border-radius: var(--radius); background: var(--faint); }
.route { background: var(--surface); border-radius: var(--radius); padding: 18px; align-self: start; }
.route h4 { margin: 0 0 12px; font-size: 13px; color: var(--muted); font-weight: 500; }
.stop { display: grid; grid-template-columns: 22px 1fr; gap: 12px; }
.stop .rail { display: flex; flex-direction: column; align-items: center; }
.stop .rail i { flex: 1; width: 2px; background: repeating-linear-gradient(var(--faint) 0 4px, transparent 4px 8px); margin: 4px 0; }
.stop .name { font-weight: 600; font-size: 14px; cursor: pointer; }
.stop .leg { font-size: 12.5px; color: var(--muted); padding: 4px 0 16px; font-variant-numeric: tabular-nums; }
.stop.last { padding-bottom: 14px; }
.leaflet-tile-pane { filter: var(--tiles); }
.route .total { border-top: 1px solid var(--faint); padding-top: 10px; font-size: 13px; font-variant-numeric: tabular-nums; }
.notice { background: var(--warn-soft); color: var(--warn); padding: 10px 14px; border-radius: 10px; margin-bottom: 14px; font-size: 13.5px; }
.leaflet-container { font: 13px var(--font); outline: none; }
.leaflet-popup-content-wrapper { border-radius: 12px; }

/* Gallery */
.gal-group { margin-bottom: 30px; }
.gal-group h3 { font-size: 15px; margin: 0 0 10px; }
.masonry { columns: 4 200px; column-gap: 10px; }
.masonry figure { break-inside: avoid; margin: 0 0 10px; position: relative; border-radius: 10px; overflow: hidden; }
.masonry img { width: 100%; display: block; cursor: zoom-in; }
.masonry figcaption { position: absolute; inset: auto 0 0; padding: 18px 10px 8px; font-size: 12px; color: #fff; background: linear-gradient(transparent, rgba(0,0,0,.55)); }

/* Compare */
.table-wrap { overflow-x: auto; background: var(--surface); border-radius: var(--radius); }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { padding: 12px 14px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--faint); }
thead th { font-weight: 600; white-space: nowrap; }
tbody th { color: var(--muted); font-weight: 500; white-space: nowrap; }
tr:last-child > * { border-bottom: 0; }

/* Materials */
.filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; align-items: center; }
.filters input, .filters select { font: 14px var(--font); padding: 7px 10px; border: 1px solid var(--faint); border-radius: 8px; background: var(--surface); color: var(--ink); }
.filters input { flex: 1 1 220px; min-width: 0; }
.count { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.mats { background: var(--surface); border-radius: var(--radius); padding: 0 16px; }
.mat { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--faint); }
.mat:last-child { border-bottom: 0; }
.mat img, .mat .ph { width: 52px; height: 52px; object-fit: cover; border-radius: 8px; background: var(--bg); }
.mat .line { display: flex; gap: 8px; align-items: baseline; min-width: 0; }
.mat .title { font-weight: 500; text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mat .title:hover { color: var(--accent); }
.mat.is-drop .title { color: var(--muted); }
.mat .meta { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.mat .why { font-size: 13px; }
.pill { flex: none; font-size: 11.5px; font-weight: 600; padding: 0 7px; border-radius: 99px; color: var(--c); background: color-mix(in srgb, var(--c) 12%, transparent); }

#lightbox { position: fixed; inset: 0; background: rgba(10,12,16,.88); display: flex; align-items: center; justify-content: center; z-index: 2000; padding: 24px; flex-direction: column; gap: 12px; }
#lightbox img { max-width: 100%; max-height: 84vh; border-radius: 8px; }
#lightbox a { color: #fff; font-size: 14px; }

@media (max-width: 760px) {
  .map-layout { grid-template-columns: 1fr; }
  #map-canvas { height: 52vh; }
}
@media (max-width: 480px) {
  header { padding-block: 24px 4px; }
  .cards { grid-template-columns: 1fr; }
  .funnel-row { grid-template-columns: 40px 1fr 48px; }
}
@media (prefers-reduced-motion: no-preference) {
  .bar i { transition: width .5s ease; }
}

/* Shareable report */
body { font-size: 1rem; }
h1 { font-size: clamp(2rem, 5vw, 3rem); letter-spacing: -.025em; }
.intro-line { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.intro-line .eyebrow { margin: 0; font-size: .875rem; letter-spacing: 0; }
.share { min-height: 44px; padding: 8px 14px; border: 1px solid var(--faint); border-radius: 99px;
  color: var(--ink); background: var(--surface); font: 500 .875rem var(--font); cursor: pointer; }
#share-status:empty { display: none; }
#share-url { min-width: 0; width: 100%; min-height: 44px; font: inherit; }
.plan { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.plan a { display: grid; align-content: center; min-height: 66px; padding: 10px 14px; text-decoration: none;
  border-radius: 12px; background: var(--accent-soft); overflow-wrap: anywhere; }
.plan a span { font-size: .875rem; color: var(--muted); }
.plan a:hover strong { text-decoration: underline; }
.booking { margin: 0; font-size: .875rem; color: var(--muted); }
.report-notes summary { min-height: 44px; padding-block: 10px; font-size: .875rem; cursor: pointer; color: var(--muted); }
nav { padding-block: 8px; }
.seg { width: 100%; }
.seg button { min-height: 44px; flex: 1; padding-inline: 10px; }
.jump a { min-height: 44px; align-items: center; }
.facts, .pc, .src, .when, .sec-note { font-size: .9375rem; }
.src a { align-items: start; }
.src .dot { margin-top: .5rem; }
.src .t { white-space: normal; overflow-wrap: anywhere; }
.src q { margin-top: -3px; }
.table-hint { display: none; font-size: .875rem; color: var(--muted); }
.cmp td { min-width: 138px; }
.filters input, .filters select { min-height: 44px; font-size: 1rem; }
@media (max-width: 600px) {
  .plan { grid-template-columns: 1fr; gap: 6px; }
  .plan a { min-height: 54px; padding-block: 6px; }
  .card-body { padding-inline: 14px; }
  .table-hint { display: block; margin: 0 0 8px; }
  .cmp th:first-child { position: sticky; left: 0; background: var(--surface); }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="intro-line">
      <p class="eyebrow">北京 · 海淀 / 五道口</p>
      <button type="button" class="share" id="share">分享链接</button>
    </div>
    <h1>海淀约会指南</h1>
    <p class="summary" id="summary" hidden></p>
    <div class="plan" aria-label="首选安排">
      <a href="#e-pottery"><span>下午 · 双人手作</span><strong>陶艺捏泥巴</strong></a>
      <a href="#e-vinn"><span>晚餐 · 北邮附近</span><strong>VINN 维恩西餐</strong></a>
      <a href="#e-annie"><span>晚餐备选 · 五道口</span><strong>安妮意大利餐厅</strong></a>
    </div>
    <p class="booking">目标预算 ¥300–500 / 人。价格、营业时间及预约要求请以商家信息为准。 <a href="haidian-guide.pdf" download="海淀约会指南.pdf">下载离线版 PDF</a></p>
    <details class="report-notes">
      <summary>调研范围与日期</summary>
      <div class="coverage" id="coverage"></div>
      <div class="funnel" id="funnel"></div>
    </details>
    <div id="share-status" role="status" aria-live="polite"></div>
    <input id="share-url" aria-label="分享网址" readonly hidden>
  </header>
  <nav><div class="seg" id="tabs" role="tablist"></div></nav>
  <main>
    <section id="v-cards"><div class="cards" id="card-list"></div></section>
    <section id="v-map" hidden>
      <div id="map-notice"></div>
      <div class="map-layout" id="map-layout"><div id="map-canvas"></div><aside class="route" id="route" hidden></aside></div>
    </section>
    <section id="v-gallery" hidden><div id="gallery-list"></div></section>
    <section id="v-compare" hidden><div class="table-wrap" id="compare-table"></div></section>
    <section id="v-materials" hidden>
      <div class="filters">
        <input id="q" type="search" placeholder="搜索标题、作者、关键词或理由" aria-label="搜索">
        <select id="fp" aria-label="平台"><option value="">全部平台</option><option value="xhs">小红书</option><option value="bili">B 站</option></select>
        <select id="fv" aria-label="结论"><option value="">全部结论</option><option value="keep">保留</option><option value="maybe">待定</option><option value="drop">排除</option><option value="none">未筛选</option></select>
        <select id="fs" aria-label="阅读状态"><option value="">已读和未读</option><option value="read">已读</option><option value="candidate">未读</option></select>
        <span class="count" id="mcount"></span>
      </div>
      <div class="mats" id="mat-list"></div>
    </section>
  </main>

": "6b052230000000002b035ecb", "title": "🔥密室玩家蹲住！长藤密室五棵松华熙新店", "author": "听七秒", "url": "https://www.xiaohongshu.com/explore/6b052230000000002b035ecb", "published_at": null, "state": "candidate", "verdict": null, "reason": null, "keywords": ["北京 密室 双人 约会 推荐"], "stats": {"likes": 0, "collects": 0, "comments_count": 1, "note_type": "image"}, "cover": null}], "generated_at": "2026-11-25T15:00:14+08:00"}</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const PLAT = {xhs: '小红书', bili: 'B 站'};
const PCOLOR = {xhs: 'var(--xhs)', bili: 'var(--bili)'};
const VERDICT = {keep: ['保留', 'var(--keep)'], maybe: ['待定', 'var(--maybe)'], drop: ['排除', 'var(--drop)']};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const day = s => s ? s.slice(0, 10) : '';
const byId = Object.fromEntries(D.entities.map(e => [e.id, e]));
const stops = D.route ? D.route.stops : [];

// Header
document.title = D.title;
const shareLink = new URL(location.href);
shareLink.hash = '';
$('share').addEventListener('click', async () => {
  if (navigator.share) {
    try {
      await navigator.share({title: D.title, url: shareLink.href});
      return;
    } catch (error) {
      if (error.name === 'AbortError') return;
    }
  }
  try {
    await navigator.clipboard.writeText(shareLink.href);
    $('share-status').textContent = '链接已复制';
    $('share-url').hidden = true;
  } catch {
    $('share-status').textContent = '长按或选中下方链接即可复制';
    $('share-url').value = shareLink.href;
    $('share-url').hidden = false;
    $('share-url').focus();
    $('share-url').select();
  }
});
if (D.summary) { $('summary').hidden = false; $('summary').textContent = D.summary; }
$('coverage').textContent = [D.coverage, '生成于 ' + D.generated_at.slice(0, 16).replace('T', ' ')].filter(Boolean).join(' · ');

// Funnel: how much was collected, read and kept, split by platform. Bars share one scale (total).
(function () {
  const M = D.materials, total = M.length || 1;
  const plats = [...new Set(M.map(m => m.platform))];
  const rows = [
    ['收集', M],
    ['保留', M.filter(m => m.verdict === 'keep' || m.verdict === 'maybe')],
    ['已读', M.filter(m => m.state === 'read')],
  ];
  $('funnel').innerHTML = rows.map(([lab, set]) => `<div class="funnel-row"><span class="lab">${lab}</span>
    <div class="bar">${plats.map(p => `<i style="width:${set.filter(m => m.platform === p).length / total * 100}%;background:${PCOLOR[p] || 'var(--accent)'}"></i>`).join('')}</div>
    <span class="num">${set.length}</span></div>`).join('') +
    `<div class="legend">${plats.map(p => `<span style="--c:${PCOLOR[p] || 'var(--accent)'}">${PLAT[p] || p} ${M.filter(m => m.platform === p).length}</span>`).join('')}
     <span style="--c:var(--drop)">排除 ${M.filter(m => m.verdict === 'drop').length}</span></div>`;
})();

// Tabs
const LABEL = {cards: '地点', map: '地图', gallery: '图片', compare: '对比', materials: '全部材料'};
const views = [...D.views, 'materials'];
let mapDrawn = false;
function show(v) {
  for (const b of $('tabs').children) b.setAttribute('aria-selected', b.dataset.v === v);
  for (const x of Object.keys(LABEL)) $('v-' + x).hidden = x !== v;
  if (v === 'map' && !mapDrawn) { mapDrawn = true; drawMap(); }
  try { history.replaceState(null, '', '#' + v); } catch (e) {}
}
$('tabs').innerHTML = views.map(v => `<button role="tab" data-v="${v}">${LABEL[v]}</button>`).join('');
$('tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (b) show(b.dataset.v); });
function goto(id) {
  show('cards');
  const el = $('e-' + id);
  if (el) {
    try { history.replaceState(null, '', '#e-' + id); } catch {}
    el.scrollIntoView({block: 'start'});
  }
}
document.querySelector('.plan').addEventListener('click', event => {
  const link = event.target.closest('a');
  if (!link) return;
  event.preventDefault();
  goto(link.hash.slice(3));
});

// Lightbox
const lb = $('lightbox');
function zoom(src, post) { lb.querySelector('img').src = src; lb.querySelector('a').href = post; lb.hidden = false; }
lb.addEventListener('click', e => { if (e.target.tagName !== 'A') lb.hidden = true; });
document.addEventListener('keydown', e => { if (e.key === 'Escape') lb.hidden = true; });
document.addEventListener('click', e => {
  const img = e.target.closest('img[data-e]');
  if (img) { const p = byId[img.dataset.e].photos[+img.dataset.i]; zoom(p.src, p.post); }
});

// Cards
function sourceLink(s) {
  const t = s.t != null ? ` · ${Math.floor(s.t / 60)}:${String(s.t % 60).padStart(2, '0')}` : '';
  return `<a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer"><span class="dot" style="--c:${PCOLOR[s.platform] || 'var(--accent)'}"></span>
    <span class="t">${esc(s.title || s.id)}<span style="color:var(--muted)"> · ${esc(s.author || '')}${s.published_at ? ' · ' + day(s.published_at) : ''}${t}</span></span>
    ${s.quote ? `<q>${esc(s.quote)}</q>` : ''}</a>`;
}
function card(e) {
  const n = stops.indexOf(e.id);
  const [first, ...rest] = e.photos;
  const facts = [e.price, e.hours, e.address || e.geo_address].filter(Boolean).map(esc).join(' · ');
  const authors = new Set(e.sources.map(s => s.platform + (s.author || s.id))).size;
  const pros = (e.pros || []).map(x => `<li>${esc(x)}</li>`).join('') + (e.cons || []).map(x => `<li class="con">${esc(x)}</li>`).join('');
  return `<article class="card${e.pick ? ' is-pick' : ''}" id="e-${esc(e.id)}" style="--c:${color(e)}">
    ${first ? `<img class="cover" loading="lazy" src="${esc(first.src)}" data-e="${esc(e.id)}" data-i="0" alt="${esc(e.name)}">` : ''}
    <div class="card-body">
      <div class="card-head"><h3>${esc(e.name)}</h3>${e.pick ? '<span class="pick">首选</span>' : ''}${n >= 0 ? `<span class="pin">${n + 1}</span>` : ''}</div>
      ${e.when ? `<div class="when">${esc(e.when)}</div>` : ''}
      ${facts ? `<div class="facts">${facts}</div>` : ''}
      ${e.flags.length || (e.tags || []).length ? `<div class="tags">${e.flags.map(f => `<span class="flag">${esc(f.label)}</span>`).join('')}${(e.tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>` : ''}
      ${e.note ? `<div>${esc(e.note)}</div>` : ''}
      ${pros ? `<ul class="pc">${pros}</ul>` : ''}
      ${rest.length ? `<div class="strip">${rest.map((p, i) => `<img loading="lazy" src="${esc(p.src)}" data-e="${esc(e.id)}" data-i="${i + 1}" alt="">`).join('')}</div>` : ''}
      <div class="src"><span class="consensus">${authors} 个独立来源</span>${e.sources.slice(0, 3).map(sourceLink).join('')}${
        e.sources.length > 3 ? `<details><summary>另外 ${e.sources.length - 3} 条来源</summary>${e.sources.slice(3).map(sourceLink).join('')}</details>` : ''}</div>
    </div></article>`;
}
// Group cards by section (order from findings.sections); picks lead each section.
const SECS = (D.sections || []).map((x, i) => ({...x, c: `var(--s${i % 6 + 1})`}));
const secOf = Object.fromEntries(SECS.map(x => [x.id, x]));
const color = e => (secOf[e.section] || {}).c || 'var(--accent)';
const ranked = list => [...list].sort((a, b) => b.pick - a.pick);
if (SECS.length) {
  const groups = SECS.map(x => ({...x, items: ranked(D.entities.filter(e => e.section === x.id))}));
  $('card-list').className = '';
  $('card-list').innerHTML = (groups.length > 1 ? `<div class="jump">${groups.map(g =>
      `<a href="#s-${esc(g.id)}" data-s="${esc(g.id)}" style="--c:${g.c}"><i></i>${esc(g.title)}<span>${g.items.length}</span></a>`).join('')}</div>` : '') +
    groups.map(g => `<div class="sec" id="s-${esc(g.id)}" style="--c:${g.c}"><div class="sec-head"><h2>${esc(g.title)}</h2>
      <span class="n">${g.items.length} 个选项${g.items.some(e => e.pick) ? ` · ${g.items.filter(e => e.pick).length} 个首选` : ''}</span>
      ${g.note ? `<p class="sec-note">${esc(g.note)}</p>` : ''}</div>
      <div class="cards">${g.items.map(card).join('')}</div></div>`).join('');
  $('card-list').addEventListener('click', e => {
    const a = e.target.closest('a[data-s]');
    if (a) { e.preventDefault(); $('s-' + a.dataset.s).scrollIntoView({behavior: 'smooth', block: 'start'}); }
  });
} else {
  $('card-list').innerHTML = ranked(D.entities).map(card).join('');
}

// Map
const km = m => m >= 1000 ? (m / 1000).toFixed(1) + ' km' : m + ' m';
const mins = s => { const m = Math.round(s / 60); return m >= 60 ? `${Math.floor(m / 60)} 小时 ${m % 60} 分` : `${m} 分钟`; };
function drawMap() {
  const placed = D.entities.filter(e => e.lnglat);
  const missing = D.entities.filter(e => !e.lnglat && (e.kind === 'place' || e.address));
  const notes = [];
  if (missing.length) notes.push('未定位：' + missing.map(e => esc(e.name)).join('、'));
  if (!placed.length) notes.push('没有可显示的坐标。');
  else if (typeof L === 'undefined') notes.push('地图库没有加载（需要联网）。');
  $('map-notice').innerHTML = notes.map(n => `<div class="notice">${n}</div>`).join('');
  if (!placed.length || typeof L === 'undefined') { $('map-canvas').hidden = true; return; }
  const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
  const map = L.map('map-canvas', {zoomControl: false, attributionControl: true});
  L.control.zoom({position: 'bottomright'}).addTo(map);
  L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}',
    {subdomains: '1234', maxZoom: 18, attribution: '高德地图'}).addTo(map);
  const pins = placed.map(e => {
    const n = stops.indexOf(e.id);
    const icon = L.divIcon({className: '', iconSize: [28, 28], iconAnchor: [14, 14],
      html: `<div style="width:28px;height:28px;border-radius:50%;background:${secOf[e.section] ? getComputedStyle(document.documentElement).getPropertyValue('--s' + (SECS.indexOf(secOf[e.section]) % 6 + 1)).trim() : accent};color:#fff;font:600 13px/24px Inter,sans-serif;text-align:center;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3)">${n >= 0 ? n + 1 : '·'}</div>`});
    return L.marker([e.lnglat[1], e.lnglat[0]], {icon, title: e.name}).addTo(map)
      .bindPopup(`<b>${esc(e.name)}</b>${secOf[e.section] ? ` · ${esc(secOf[e.section].title)}` : ''}<br><span style="color:#666">${esc(e.geo_address || e.address || '')}</span><br><a href="javascript:goto('${esc(e.id)}')">看详情</a>`);
  });
  map.fitBounds(L.featureGroup(pins).getBounds().pad(0.25));
  if (SECS.length > 1) {
    const legend = L.control({position: 'topleft'});
    legend.onAdd = () => { const d = L.DomUtil.create('div', 'jump'); d.style.margin = '0';
      d.innerHTML = SECS.map(x => `<a style="--c:${x.c}"><i></i>${esc(x.title)}</a>`).join(''); return d; };
    legend.addTo(map);
  }
  if (!D.route) { $('map-layout').style.gridTemplateColumns = '1fr'; return; }
  const pts = stops.map(id => byId[id].lnglat).filter(Boolean).map(p => [p[1], p[0]]);
  if (pts.length > 1) L.polyline(pts, {color: accent, weight: 3, opacity: .85, dashArray: '2 8', lineCap: 'round'}).addTo(map);
  const legs = D.route.legs || [];
  const mode = {walking: '步行', transit: '公共交通', driving: '驾车'}[D.route.mode || 'walking'];
  let dist = 0, time = 0;
  $('route').hidden = false;
  $('route').innerHTML = `<h4>路线 · ${mode}</h4>` + stops.map((id, i) => {
    const leg = legs[i];
    if (leg && leg.distance != null) { dist += leg.distance; time += leg.duration; }
    return `<div class="stop${i === stops.length - 1 ? ' last' : ''}"><div class="rail"><span class="pin">${i + 1}</span>${i < stops.length - 1 ? '<i></i>' : ''}</div>
      <div><div class="name" onclick="goto('${esc(id)}')">${esc(byId[id].name)}</div>
      ${i < stops.length - 1 ? `<div class="leg">${leg && leg.distance != null ? `${km(leg.distance)} · ${mins(leg.duration)}` : '距离未知'}</div>` : ''}</div></div>`;
  }).join('') + (time ? `<div class="total">合计 ${km(dist)} · 约 ${mins(time)}，不含停留</div>` : '');
}

// Gallery
(function () {
  const groups = D.entities.filter(e => e.photos.length);
  $('gallery-list').innerHTML = groups.length ? groups.map(e => `<div class="gal-group"><h3>${esc(e.name)}</h3><div class="masonry">${
    e.photos.map((p, i) => `<figure><img loading="lazy" src="${esc(p.src)}" data-e="${esc(e.id)}" data-i="${i}" alt="">${p.caption ? `<figcaption>${esc(p.caption)}</figcaption>` : ''}</figure>`).join('')
  }</div></div>`).join('') : '<div class="notice">这份报告没有挑选图片。</div>';
})();

// Compare: one table per entry; columns are the entities it names (or its section's, or all).
(function () {
  $('compare-table').className = '';
  $('compare-table').innerHTML = (D.compare || []).map(c => {
    const ids = Object.keys(c.cells || {}).length ? Object.keys(c.cells)
      : D.entities.filter(e => !c.section || e.section === c.section).map(e => e.id);
    const head = c.title || (secOf[c.section] || {}).title;
    return `<div class="cmp">${head ? `<h3>${esc(head)}</h3>` : ''}<p class="table-hint">左右滑动查看对比</p><div class="table-wrap" tabindex="0" aria-label="活动对比表"><table><thead><tr><th></th>${ids.map(id => `<th>${esc(byId[id] ? byId[id].name : id)}</th>`).join('')}</tr></thead><tbody>${
      c.dimensions.map(d => `<tr><th>${esc(d)}</th>${ids.map(id => `<td>${esc(((c.cells || {})[id] || {})[d] || '—')}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`;
  }).join('');
})();

// Materials
const order = {keep: 0, maybe: 1, drop: 3};
const mats = [...D.materials].sort((a, b) => (order[a.verdict] ?? 2) - (order[b.verdict] ?? 2) || (b.state === 'read') - (a.state === 'read'));
function stat(s) {
  return [s.likes != null && s.likes + ' 赞', s.collects != null && s.collects + ' 收藏', s.comments_count != null && s.comments_count + ' 评论',
    s.plays != null && s.plays + ' 播放', s.duration, s.ip_location && 'IP ' + s.ip_location].filter(Boolean).join(' · ');
}
function renderMaterials() {
  const q = $('q').value.trim().toLowerCase(), fp = $('fp').value, fv = $('fv').value, fs = $('fs').value;
  const rows = mats.filter(m => (!fp || m.platform === fp) && (!fs || m.state === fs) &&
    (!fv || (fv === 'none' ? !m.verdict : m.verdict === fv)) &&
    (!q || [m.title, m.author, m.reason, ...(m.keywords || [])].join(' ').toLowerCase().includes(q)));
  $('mcount').textContent = `${rows.length} / ${mats.length}`;
  $('mat-list').innerHTML = rows.slice(0, 600).map(m => {
    const [vl, vc] = VERDICT[m.verdict] || ['未筛选', 'var(--muted)'];
    return `<div class="mat ${m.verdict === 'drop' ? 'is-drop' : ''}">
      ${m.cover ? `<img loading="lazy" src="${esc(m.cover)}" alt="">` : '<div class="ph"></div>'}
      <div style="min-width:0">
        <div class="line"><span class="pill" style="--c:${vc}">${vl}</span><a class="title" href="${esc(m.url)}" target="_blank" rel="noopener noreferrer">${esc(m.title || m.id)}</a></div>
        <div class="meta"><span class="dot" style="--c:${PCOLOR[m.platform] || 'var(--accent)'}"></span> ${PLAT[m.platform] || m.platform} · ${esc(m.author || '')}${m.published_at ? ' · ' + day(m.published_at) : ''}${stat(m.stats) ? ' · ' + stat(m.stats) : ''} · ${m.state === 'read' ? '已读' : '未读'}</div>
        ${m.reason ? `<div class="why">${esc(m.reason)}</div>` : ''}
      </div></div>`;
  }).join('') + (rows.length > 600 ? '<div class="mat"><div></div><div class="meta">只显示前 600 条，用上面的筛选缩小范围。</div></div>' : '');
  $('mat-list').hidden = !rows.length;
}
for (const id of ['q', 'fp', 'fv', 'fs']) $(id).addEventListener('input', renderMaterials);
renderMaterials();

const start = location.hash.slice(1);
show(views.includes(start) ? start : views[0]);
if (start.startsWith('e-') && byId[start.slice(2)]) goto(start.slice(2));
</script>
</body>
</html>
